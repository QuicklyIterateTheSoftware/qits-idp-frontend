# How this repository releases: the `spa-frontend` archetype's QA slot (`release-request:`, from
# `.config/qits/release-archetypes/spa-frontend.yml` in qits-ci) — install, lint, test, build.
#
# NO CONTRACTS (qits-2481). The pacts here were the calls @qits/ui-components made for this SPA,
# and the only one was the platform navigation's `/main-navigation` to qits-edge-service. No page
# draws that navigation any more, so `src/app/ui-components.pact.spec.ts` records no call and
# `pacts/` is empty. The last published qits-idp-frontend-pacts-qits-edge-service stays where it is.
#
# The SPA ships no image and is no deployable of its own: qits-idp-service carries it as its Quinoa
# `webui` submodule and serves it from the `qits-idp` application.
#
# NO `release:` SLOT. `spa-frontend` has none, and since qits-1149 it needs none: qits-ci
# synthesises a release step for every composition without one.
archetype: spa-frontend
